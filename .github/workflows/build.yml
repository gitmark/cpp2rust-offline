name: build-cpp2rust-image
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build image
        run: podman build -t cpp2rust-offline .

      - name: Check architecture
        run: podman image inspect cpp2rust-offline --format '{{.Architecture}}'

      - name: Export and split into USB-friendly pieces
        run: |
          podman save cpp2rust-offline | gzip > cpp2rust-offline.tar.gz
          sha256sum cpp2rust-offline.tar.gz > cpp2rust-offline.tar.gz.sha256
          split -b 1900m cpp2rust-offline.tar.gz cpp2rust-part-
          rm cpp2rust-offline.tar.gz
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: cpp2rust-offline
          path: |
            cpp2rust-part-*
            cpp2rust-offline.tar.gz.sha256
          compression-level: 0
          retention-days: 7
